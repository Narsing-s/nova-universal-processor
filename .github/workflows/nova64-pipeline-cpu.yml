name: Nova64 Five-Stage Pipeline CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - run: iverilog -g2012 -Wall -s tb_nova64_pipeline_cpu -o pipeline_cpu_test rtl64/nova64_pipeline_control.sv rtl64/nova64_pipeline_cpu.sv tests/tb_nova64_pipeline_cpu.sv
      - run: vvp pipeline_cpu_test
      - run: verilator --lint-only --timing -Wall -Wno-fatal --top-module nova64_pipeline_cpu rtl64/nova64_pipeline_control.sv rtl64/nova64_pipeline_cpu.sv
