name: Nova64 CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - run: iverilog -g2012 -Wall -s tb_nova64_cpu -o nova64_test rtl64/nova64_cpu.sv tests/tb_nova64_cpu.sv
      - run: vvp nova64_test
      - run: verilator --lint-only --timing -Wall -Wno-fatal --top-module nova64_cpu rtl64/nova64_cpu.sv
